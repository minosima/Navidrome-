<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidrome Smart Playlist (.nsp) Creator - Complete Edition</title>
    <style>
        /* カラーテーマ定義 (3色配色の考え方を応用) */
        [data-theme="dark-modern"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --label-color: #cbd5e1;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #f43f5e;
            --border-color: #334155;
            --group-bg: rgba(30, 41, 59, 0.7);
            --input-bg: #0b0f19;
            --hint-color: #94a3b8;
        }
        [data-theme="light-natural"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --label-color: #334155;
            --accent-color: #0d9488;
            --accent-hover: #0f766e;
            --danger-color: #e11d48;
            --border-color: #cbd5e1;
            --group-bg: #f1f5f9;
            --input-bg: #f8fafc;
            --hint-color: #64748b;
        }
        [data-theme="warm-feminine"] {
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --text-color: #4a154b;
            --label-color: #581c87;
            --accent-color: #db2777;
            --accent-hover: #be185d;
            --danger-color: #dc2626;
            --border-color: #fbcfe8;
            --group-bg: #fae8ff;
            --input-bg: #fff1f2;
            --hint-color: #9333ea;
        }
        [data-theme="cool-tech"] {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-color: #fafafa;
            --label-color: #e4e4e7;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --danger-color: #ef4444;
            --border-color: #27272a;
            --group-bg: rgba(24, 24, 27, 0.8);
            --input-bg: #09090b;
            --hint-color: #a1a1aa;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--accent-color);
        }
        p.subtitle {
            color: var(--hint-color);
            margin-top: 0;
            margin-bottom: 0;
        }
        .theme-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            white-space: nowrap; /* テキストが勝手に折り返されないようにする */
        }
        .theme-selector label {
            margin-bottom: 0;
            font-size: 0.85rem;
            color: var(--label-color);
            white-space: nowrap;
        }
        .theme-selector select {
            margin-bottom: 0;
            padding: 4px 8px;
            font-size: 0.85rem;
            width: auto;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: background 0.3s, border 0.3s;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--label-color);
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .rule-row {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .group-box {
            background: var(--group-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button.danger {
            background-color: var(--danger-color);
            color: white;
            padding: 6px 10px;
        }
        button.secondary {
            background-color: var(--border-color);
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 6px 12px;
        }
        button.secondary:hover {
            opacity: 0.8;
        }
        .artist-helper {
            background: var(--bg-color);
            padding: 12px;
            border: 1px dashed var(--accent-color);
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
        .hint {
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 5px;
        }
        pre {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent-color);
            max-height: 300px;
        }
    </style>
</head>
<body data-theme="dark-modern">

<div class="container">
    <div class="header-bar">
        <div>
            <h1>Navidrome Smart Playlist (.nsp) Creator</h1>
            <p class="subtitle">Navidromeの仕様に完全準拠したスマートプレイリストビルダー</p>
        </div>
        <div class="theme-selector">
            <label for="themeSelect">🎨 テーマ</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark-modern">ダークモダン (標準)</option>
                <option value="light-natural">ナチュラルライト</option>
                <option value="warm-feminine">ウォームフェミニン</option>
                <option value="cool-tech">クールテック</option>
            </select>
        </div>
    </div>

    <!-- 基本情報 -->
    <div class="card">
        <label for="playlistTitle">プレイリスト名</label>
        <input type="text" id="playlistTitle" placeholder="例: お気に入りの80年代ロック" value="マイスマートプレイリスト">

        <label for="playlistComment">プレイリスト説明 (comment)</label>
        <textarea id="playlistComment" placeholder="プレイリストの概要やメモを入力" style="height: 60px; resize: vertical;" oninput="updateJsonPreview()"></textarea>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label for="matchLogic">ルート条件の一致ルール (Root Match Logic)</label>
                <select id="matchLogic" onchange="updateJsonPreview()">
                    <option value="all">すべての条件に一致 (all)</option>
                    <option value="any" selected>いずれかの条件に一致 (any)</option>
                    <option value="none">いずれの条件にも一致しない (none)</option>
                </select>
            </div>
            <div>
                <label for="maxTracks">最大トラック数 (空欄で無制限)</label>
                <input type="text" id="maxTracks" placeholder="例: 100">
            </div>
        </div>
    </div>

    <!-- 条件ビルダー（ルートコンテナ） -->
    <div class="card">
        <label>抽出条件ルール & ネストグループ</label>
        <div id="rulesContainer"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="secondary" onclick="addRuleRowToContainer(document.getElementById('rulesContainer'), 'artist', 'contains', '')">＋ 条件を追加</button>
            <button class="secondary" onclick="addGroupBoxToContainer(document.getElementById('rulesContainer'))">📂 サブグループを追加</button>
        </div>
    </div>

    <!-- 並び替え・出力 -->
    <div class="card">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div>
                <label for="sortField">並び替えフィールド</label>
                <select id="sortField" onchange="updateJsonPreview()">
                    <option value="random">ランダム (シャッフル)</option>
                    <optgroup label="基本">
                        <option value="title">曲名 (title)</option>
                        <option value="artist">アーティスト (artist)</option>
                        <option value="album">アルバム (album)</option>
                        <option value="albumartist">アルバムアーティスト (albumartist)</option>
                        <option value="genre">ジャンル (genre)</option>
                        <option value="year" selected>リリース年 (year)</option>
                        <option value="duration">再生時間 (duration)</option>
                        <option value="bpm">BPM (bpm)</option>
                    </optgroup>
                    <optgroup label="統計・評価">
                        <option value="playcount">再生回数 (playcount)</option>
                        <option value="rating">評価 (rating)</option>
                        <option value="lastplayed">最終再生日時 (lastplayed)</option>
                        <option value="dateadded">追加日時 (dateadded)</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <label for="sortOrder">並び順</label>
                <select id="sortOrder" onchange="updateJsonPreview()">
                    <option value="asc">昇順 (asc)</option>
                    <option value="desc" selected>降順 (desc)</option>
                </select>
            </div>
        </div>

        <label style="margin-top: 15px;">生成される .nsp (JSON) プレビュー</label>
        <pre id="jsonPreview"></pre>

        <button onclick="downloadNspFile()" style="margin-top: 10px; width: 100%; padding: 12px; font-size: 1rem;">💾 .nspファイルをダウンロード</button>
    </div>
</div>

<script>
    const fieldCategories = [
        {
            group: '基本情報 (Core Track Info)',
            fields: [
                { value: 'title', label: '曲名 (title)', type: 'string' },
                { value: 'album', label: 'アルバム (album)', type: 'string' },
                { value: 'artist', label: 'アーティスト (artist)', type: 'string' },
                { value: 'albumartist', label: 'アルバムアーティスト (albumartist)', type: 'string' },
                { value: 'genre', label: 'ジャンル (genre)', type: 'string' },
                { value: 'composer', label: '作曲者 (composer)', type: 'string' },
                { value: 'lyricist', label: '作詞者 (lyricist)', type: 'string' },
                { value: 'arranger', label: '編曲者 (arranger)', type: 'string' },
                { value: 'conductor', label: '指揮者 (conductor)', type: 'string' },
                { value: 'producer', label: 'プロデューサー (producer)', type: 'string' },
                { value: 'remixer', label: 'リミキサー (remixer)', type: 'string' },
                { value: 'performer', label: '演奏者 (performer)', type: 'string' },
                { value: 'comment', label: 'コメント (comment)', type: 'string' },
                { value: 'year', label: 'リリース年 (year)', type: 'number' },
                { value: 'originalyear', label: 'オリジナルリリース年 (originalyear)', type: 'number' },
                { value: 'track', label: 'トラック番号 (track)', type: 'number' },
                { value: 'disc', label: 'ディスク番号 (disc)', type: 'number' },
                { value: 'duration', label: '再生時間秒 (duration)', type: 'number' },
                { value: 'bpm', label: 'BPM (bpm)', type: 'number' },
                { value: 'compilation', label: 'コンピレーション (compilation)', type: 'boolean' }
            ]
        },
        {
            group: '再生・お気に入り (Listening & Favorites)',
            fields: [
                { value: 'playcount', label: '再生回数 (playcount)', type: 'number' },
                { value: 'skipcount', label: 'スキップ回数 (skipcount)', type: 'number' },
                { value: 'rating', label: '評価 0-5 (rating)', type: 'number' },
                { value: 'loved', label: 'お気に入り (loved)', type: 'boolean' },
                { value: 'lastplayed', label: '最終再生日時 (lastplayed)', type: 'date' },
                { value: 'lastskipped', label: '最終スキップ日時 (lastskipped)', type: 'date' },
                { value: 'dateadded', label: 'ライブラリ追加日時 (dateadded)', type: 'date' }
            ]
        },
        {
            group: 'ファイル・技術仕様 (File & Tech Specs)',
            fields: [
                { value: 'path', label: 'ファイルパス (path)', type: 'string' },
                { value: 'format', label: '音声フォーマット (format)', type: 'string' },
                { value: 'bitrate', label: 'ビットレート (bitrate)', type: 'number' },
                { value: 'channels', label: 'チャンネル数 (channels)', type: 'number' },
                { value: 'samplerate', label: 'サンプリングレート (samplerate)', type: 'number' },
                { value: 'size', label: 'ファイルサイズ (size)', type: 'number' }
            ]
        }
    ];

    const allFields = fieldCategories.flatMap(cat => cat.fields);
    const personFields = ['artist', 'albumartist', 'artists', 'albumartists', 'composer', 'lyricist', 'arranger', 'conductor', 'producer', 'remixer', 'performer'];

    const operators = {
        string: [
            { value: 'contains', label: '〜を含む (contains)' },
            { value: 'notContains', label: '〜を含まない (notContains)' },
            { value: 'is', label: '〜と等しい (is)' },
            { value: 'isNot', label: '〜と等しくない (isNot)' },
            { value: 'startsWith', label: '〜で始まる (startsWith)' },
            { value: 'endsWith', label: '〜で終わる (endsWith)' },
            { value: 'inPlaylist', label: 'プレイリストに含まれる (inPlaylist)' },
            { value: 'notInPlaylist', label: 'プレイリストに含まれない (notInPlaylist)' },
            { value: 'isMissing', label: '値が存在しない (isMissing)' },
            { value: 'isPresent', label: '値が存在する (isPresent)' }
        ],
        number: [
            { value: 'is', label: '〜と等しい (is)' },
            { value: 'isNot', label: '〜と等しくない (isNot)' },
            { value: 'gt', label: '〜より大きい (>)' },
            { value: 'lt', label: '〜より小さい (<)' },
            { value: 'inTheRange', label: '範囲内 (inTheRange)' },
            { value: 'isMissing', label: '値が存在しない (isMissing)' },
            { value: 'isPresent', label: '値が存在する (isPresent)' }
        ],
        boolean: [
            { value: 'is', label: '〜である (is)' },
            { value: 'isMissing', label: '値が存在しない (isMissing)' },
            { value: 'isPresent', label: '値が存在する (isPresent)' }
        ],
        date: [
            { value: 'inTheLast', label: '過去◯日以内 (inTheLast)' },
            { value: 'notInTheLast', label: '過去◯日以外 (notInTheLast)' },
            { value: 'before', label: '指定日より前 (before)' },
            { value: 'after', label: '指定日より後 (after)' },
            { value: 'inTheRange', label: '期間内 (inTheRange)' },
            { value: 'isMissing', label: '値が存在しない (isMissing)' },
            { value: 'isPresent', label: '値が存在する (isPresent)' }
        ]
    };

    function changeTheme(themeName) {
        document.body.setAttribute('data-theme', themeName);
        localStorage.setItem('nsp_theme', themeName);
    }

    function addRuleRowToContainer(container, fieldValue = 'artist', opValue = 'contains', valValue = '') {
        const row = document.createElement('div');
        row.className = 'rule-row';

        row.innerHTML = `
            <div class="row">
                <div style="flex:2.5;"></div>
                <div style="flex:2;"></div>
                <button class="danger" onclick="this.closest('.rule-row').remove(); updateJsonPreview();">✕</button>
            </div>
            <div class="artist-helper" style="display:none;">
                <div class="hint">漢字 (そのまま出力)</div>
                <div class="row">
                    <input class="jpS" placeholder="姓（漢字）" style="flex:1;" oninput="updateJsonPreview()">
                    <input class="jpG" placeholder="名（漢字）" style="flex:1;" oninput="updateJsonPreview()">
                </div>
                <div class="hint">ひらがな (カナ・ローマ字を自動生成)</div>
                <div class="row">
                    <input class="kanaS" placeholder="せい" style="flex:1;" oninput="updateJsonPreview()">
                    <input class="kanaG" placeholder="めい" style="flex:1;" oninput="updateJsonPreview()">
                </div>
                <div class="hint">直接入力 / 海外アーティスト (1行1項目)</div>
                <textarea class="rawList" placeholder="例: The Beatles&#10;例: 宇多田ヒカル" style="height:50px; margin-top:5px; width:100%;" oninput="updateJsonPreview()"></textarea>
            </div>
            <div class="normal-input" style="display:none; margin-top:8px;">
                <input type="text" class="ruleValue" value="${valValue}" placeholder="値を入力（範囲指定はカンマ区切り例: 1980,1989）" style="width:100%;" oninput="updateJsonPreview()">
            </div>
        `;

        const fieldSelect = document.createElement('select');
        fieldSelect.className = 'field';
        fieldCategories.forEach(cat => {
            const group = document.createElement('optgroup');
            group.label = cat.group;
            cat.fields.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.value;
                opt.textContent = f.label;
                if (f.value === fieldValue) opt.selected = true;
                group.appendChild(opt);
            });
            fieldSelect.appendChild(group);
        });

        const opSelect = document.createElement('select');
        opSelect.className = 'operator';

        function updateOperators() {
            const selectedField = allFields.find(f => f.value === fieldSelect.value) || allFields[0];
            const ops = operators[selectedField.type] || operators.string;
            opSelect.innerHTML = '';
            ops.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.value;
                opt.textContent = o.label;
                if (o.value === opValue) opt.selected = true;
                opSelect.appendChild(opt);
            });
            toggleInputVisibility();
        }

        function toggleInputVisibility() {
            const op = opSelect.value;
            const artistHelper = row.querySelector('.artist-helper');
            const normalInput = row.querySelector('.normal-input');

            if (op === 'isMissing' || op === 'isPresent') {
                artistHelper.style.display = 'none';
                normalInput.style.display = 'none';
            } else if (personFields.includes(fieldSelect.value)) {
                artistHelper.style.display = 'block';
                normalInput.style.display = 'none';
            } else {
                artistHelper.style.display = 'none';
                normalInput.style.display = 'block';
            }
        }

        fieldSelect.onchange = () => {
            updateOperators();
            updateJsonPreview();
        };
        opSelect.onchange = () => {
            toggleInputVisibility();
            updateJsonPreview();
        };

        row.querySelector('.row div:nth-child(1)').appendChild(fieldSelect);
        row.querySelector('.row div:nth-child(2)').appendChild(opSelect);

        container.appendChild(row);
        updateOperators();
        updateJsonPreview();
    }

    function addGroupBoxToContainer(container) {
        const groupBox = document.createElement('div');
        groupBox.className = 'group-box';
        groupBox.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 0.85rem; font-weight: bold; color: var(--accent-color);">📁 サブグループ</span>
                    <select class="subMatchLogic" style="width: auto; margin-bottom: 0; padding: 4px 8px;" onchange="updateJsonPreview()">
                        <option value="all">すべて一致 (all)</option>
                        <option value="any" selected>いずれか一致 (any)</option>
                        <option value="none">いずれも一致しない (none)</option>
                    </select>
                </div>
                <button class="danger" onclick="this.closest('.group-box').remove(); updateJsonPreview();">✕ グループ削除</button>
            </div>
            <div class="sub-rules-container" style="margin-left: 10px; border-left: 2px solid var(--border-color); padding-left: 15px;"></div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="secondary" onclick="addRuleRowToContainer(this.previousElementSibling.previousElementSibling, 'artist', 'contains', '')">＋ 条件を追加</button>
                <button class="secondary" onclick="addGroupBoxToContainer(this.previousElementSibling.previousElementSibling.previousElementSibling)">📂 サブグループを追加</button>
            </div>
        `;
        container.appendChild(groupBox);
        
        const subContainer = groupBox.querySelector('.sub-rules-container');
        addRuleRowToContainer(subContainer, 'artist', 'contains', '');
        updateJsonPreview();
    }

    function getFullVariations(text, allowReverse = false) {
        if (!text) return [];
        let results = new Set();
        const jpHalf = text.trim();
        [jpHalf].forEach(t => {
            results.add(t);
            const katakana = t.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
            results.add(katakana);
        });
        const romanMap = {'あ':['a'],'い':['i'],'う':['u'],'え':['e'],'お':['o'],'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],'さ':['sa'],'し':['shi','si'],'す':['su'],'せ':['se'],'そ':['so'],'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],'や':['ya'],'ゆ':['yu'],'よ':['yo'],'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],'わ':['wa'],'를':['wo','o'],'ん':['n','nn'],'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],'だ':['da'],'ぢ':['ji','di'],'づ':['zu','du'],'で':['de'],'ど':['do'],'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],'じゃ':['ja','zya'],'じゅ':['ju','zyu'],'じょ':['jo','zyo'],'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],'っ':['t','s','k','p']};
        function toRoman(str) {
            let s = str;
            let patterns = [''];
            let i = 0;
            while (i < s.length) {
                let found = false;
                if (i + 1 < s.length) {
                    let doubleChar = s.substring(i, i + 2);
                    if (romanMap[doubleChar]) {
                        let nextPatterns = [];
                        patterns.forEach(p => { romanMap[doubleChar].forEach(r => nextPatterns.push(p + r)); });
                        patterns = nextPatterns;
                        i += 2; found = true;
                    }
                }
                if (!found) {
                    let singleChar = s.substring(i, i + 1);
                    if (romanMap[singleChar]) {
                        let nextPatterns = [];
                        patterns.forEach(p => {
                            if (singleChar === 'っ' && i + 1 < s.length) {
                                let nextChar = s.substring(i+1, i+2);
                                let nextRom = romanMap[nextChar] ? romanMap[nextChar][0][0] : '';
                                nextPatterns.push(p + nextRom);
                            } else {
                                romanMap[singleChar].forEach(r => nextPatterns.push(p + r));
                            }
                        });
                        patterns = nextPatterns;
                    } else {
                        patterns = patterns.map(p => p + singleChar);
                    }
                    i++;
                }
            }
            return patterns;
        }
        toRoman(jpHalf).forEach(r => results.add(r));
        if(allowReverse && jpHalf.includes(' ')) {
            const parts = jpHalf.split(' ');
            if(parts.length === 2) {
                const reversed = parts[1] + ' ' + parts[0];
                toRoman(reversed).forEach(r => results.add(r));
            }
        }
        return Array.from(results);
    }

    function parseContainer(container) {
        const conditions = [];
        const children = container.children;

        for (let child of children) {
            if (child.classList.contains('rule-row')) {
                const field = child.querySelector('.field').value;
                const op = child.querySelector('.operator').value;

                if (op === 'isMissing' || op === 'isPresent') {
                    conditions.push({ [op]: field });
                } else if (personFields.includes(field)) {
                    const v = new Set();
                    const kanjiS = child.querySelector('.jpS')?.value.trim() || '';
                    const kanjiG = child.querySelector('.jpG')?.value.trim() || '';
                    if(kanjiS || kanjiG) {
                        v.add((kanjiS + kanjiG).trim());
                        v.add((kanjiS + ' ' + kanjiG).trim());
                    }
                    const kanaS = child.querySelector('.kanaS')?.value.trim() || '';
                    const kanaG = child.querySelector('.kanaG')?.value.trim() || '';
                    if(kanaS || kanaG) {
                        const basePattern = (kanaS + ' ' + kanaG).trim();
                        getFullVariations(basePattern, true).forEach(variation => v.add(variation)); 
                    }
                    const rawList = child.querySelector('.rawList')?.value || '';
                    rawList.split('\n').forEach(val => { 
                        const line = val.trim();
                        if(line) {
                            if(/[ぁ-ん]/.test(line)) { getFullVariations(line, false).forEach(variation => v.add(variation)); }
                            else { v.add(line); }
                        }
                    });

                    v.forEach(val => {
                        conditions.push({ [op]: { [field]: val } });
                    });
                } else {
                    const valInput = child.querySelector('.ruleValue');
                    if (valInput) {
                        let val = valInput.value;
                        if (op === 'inTheRange' && val.includes(',')) {
                            val = val.split(',').map(item => {
                                let trimmed = item.trim();
                                return !isNaN(trimmed) && trimmed !== '' ? Number(trimmed) : trimmed;
                            });
                        } else {
                            if (val === 'true') val = true;
                            else if (val === 'false') val = false;
                            else if (!isNaN(val) && val.trim() !== '') val = Number(val);
                        }

                        conditions.push({ [op]: { [field]: val } });
                    }
                }
            } else if (child.classList.contains('group-box')) {
                const subLogic = child.querySelector('.subMatchLogic').value;
                const subContainer = child.querySelector('.sub-rules-container');
                const subConditions = parseContainer(subContainer);
                if (subConditions.length > 0) {
                    conditions.push({ [subLogic]: subConditions });
                }
            }
        }
        return conditions;
    }

    function buildNspObject() {
        const title = document.getElementById('playlistTitle').value || 'マイスマートプレイリスト';
        const comment = document.getElementById('playlistComment').value.trim();
        const matchLogic = document.getElementById('matchLogic').value;
        const limitStr = document.getElementById('maxTracks').value;
        const sortField = document.getElementById('sortField').value;
        const sortOrder = document.getElementById('sortOrder').value;

        const rulesContainer = document.getElementById('rulesContainer');
        const ruleConditions = parseContainer(rulesContainer);

        const nsp = {
            title: title
        };

        if (comment) {
            nsp.comment = comment;
        }

        nsp[matchLogic] = ruleConditions;
        nsp.sort = sortField;

        if (sortField !== 'random') {
            nsp.order = sortOrder;
        }

        if (limitStr && !isNaN(limitStr) && limitStr.trim() !== '') {
            nsp.limit = Number(limitStr);
        }

        return nsp;
    }

    function updateJsonPreview() {
        const nspObj = buildNspObject();
        document.getElementById('jsonPreview').textContent = JSON.stringify(nspObj, null, 2);
    }

    function downloadNspFile() {
        const nspObj = buildNspObject();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(nspObj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);

        let filename = (document.getElementById('playlistTitle').value || 'playlist').replace(/[\/\\?%*:|"<>]/g, '_') + '.nsp';
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    window.onload = () => {
        // 保存されたテーマがあれば復元
        const savedTheme = localStorage.getItem('nsp_theme') || 'dark-modern';
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeSelect').value = savedTheme;

        addRuleRowToContainer(document.getElementById('rulesContainer'), 'artist', 'contains', '');
        document.getElementById('playlistTitle').oninput = updateJsonPreview;
        document.getElementById('maxTracks').oninput = updateJsonPreview;
    };
</script>
