<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidrome Smart Playlist (.nsp) Creator - Full Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #f43f5e;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--accent-color);
        }
        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .rule-row {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button.danger {
            background-color: var(--danger-color);
            color: white;
            padding: 6px 10px;
        }
        button.secondary {
            background-color: #475569;
            color: white;
        }
        button.secondary:hover {
            background-color: #64748b;
        }
        .artist-helper {
            background: #0f172a;
            padding: 12px;
            border: 1px dashed var(--accent-color);
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        pre {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 300px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Navidrome Smart Playlist (.nsp) Creator</h1>
    <p class="subtitle">Navidromeの全100+フィールド・全演算子に対応した完全版スマートプレイリストビルダー</p>

    <!-- 基本情報 -->
    <div class="card">
        <label for="playlistTitle">プレイリスト名</label>
        <input type="text" id="playlistTitle" placeholder="例: お気に入りの80年代ロック" value="マイスマートプレイリスト">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label for="matchLogic">条件の一致ルール (Operator)</label>
                <select id="matchLogic">
                    <option value="all">すべての条件に一致 (AND)</option>
                    <option value="any">いずれかの条件に一致 (OR)</option>
                </select>
            </div>
            <div>
                <label for="maxTracks">最大トラック数 (空欄で無制限)</label>
                <input type="text" id="maxTracks" placeholder="例: 100">
            </div>
        </div>
    </div>

    <!-- 条件ビルダー -->
    <div class="card">
        <label>抽出条件ルール</label>
        <div id="rulesContainer"></div>
        <button class="secondary" onclick="addRuleRow()">＋ 条件を追加</button>
    </div>

    <!-- 並び替え・出力 -->
    <div class="card">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div>
                <label for="sortField">並び替えフィールド</label>
                <select id="sortField" onchange="updateJsonPreview()">
                    <option value="random">ランダム (シャッフル)</option>
                    <optgroup label="基本">
                        <option value="title">曲名 (title)</option>
                        <option value="artist">アーティスト (artist)</option>
                        <option value="album">アルバム (album)</option>
                        <option value="albumartist">アルバムアーティスト (albumartist)</option>
                        <option value="genre">ジャンル (genre)</option>
                        <option value="year">リリース年 (year)</option>
                        <option value="duration">再生時間 (duration)</option>
                        <option value="bpm">BPM (bpm)</option>
                    </optgroup>
                    <optgroup label="統計・評価">
                        <option value="playcount">再生回数 (playcount)</option>
                        <option value="rating">評価 (rating)</option>
                        <option value="lastplayed">最終再生日時 (lastplayed)</option>
                        <option value="dateadded">追加日時 (dateadded)</option>
                    </optgroup>
                    <optgroup label="ソート専用">
                        <option value="titlesort">曲名ソート (titlesort)</option>
                        <option value="artistsort">アーティストソート (artistsort)</option>
                        <option value="albumsort">アルバムソート (albumsort)</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <label for="sortOrder">並び順</label>
                <select id="sortOrder" onchange="updateJsonPreview()">
                    <option value="asc">昇順 (ASC)</option>
                    <option value="desc" selected>降順 (DESC)</option>
                </select>
            </div>
        </div>

        <label style="margin-top: 15px;">生成される .nsp (JSON) プレビュー</label>
        <pre id="jsonPreview"></pre>

        <button onclick="downloadNspFile()" style="margin-top: 10px; width: 100%; padding: 12px; font-size: 1rem;">💾 .nspファイルをダウンロード</button>
    </div>
</div>

<script>
    // 全フィールド定義（カテゴリ別）
    const fieldCategories = [
        {
            group: '基本情報 (Core Track Info)',
            fields: [
                { value: 'title', label: '曲名 (title)', type: 'string' },
                { value: 'album', label: 'アルバム (album)', type: 'string' },
                { value: 'artist', label: 'アーティスト (artist)', type: 'string' },
                { value: 'albumartist', label: 'アルバムアーティスト (albumartist)', type: 'string' },
                { value: 'genre', label: 'ジャンル (genre)', type: 'string' },
                { value: 'composer', label: '作曲者 (composer)', type: 'string' },
                { value: 'year', label: 'リリース年 (year)', type: 'number' },
                { value: 'track', label: 'トラック番号 (track)', type: 'number' },
                { value: 'discnumber', label: 'ディスク番号 (discnumber)', type: 'number' },
                { value: 'duration', label: '再生時間秒 (duration)', type: 'number' },
                { value: 'bpm', label: 'BPM (bpm)', type: 'number' }
            ]
        },
        {
            group: 'アーティスト・人物 (Artists & People)',
            fields: [
                { value: 'albumartists', label: 'アルバムアーティスト(複数) (albumartists)', type: 'string' },
                { value: 'artists', label: 'アーティスト(複数) (artists)', type: 'string' },
                { value: 'arranger', label: '編曲者 (arranger)', type: 'string' },
                { value: 'conductor', label: '指揮者 (conductor)', type: 'string' },
                { value: 'lyricist', label: '作詞者 (lyricist)', type: 'string' },
                { value: 'producer', label: 'プロデューサー (producer)', type: 'string' },
                { value: 'remixer', label: 'リミキサー (remixer)', type: 'string' },
                { value: 'performer', label: '演奏者 (performer)', type: 'string' }
            ]
        },
        {
            group: 'アルバム詳細 (Album Details)',
            fields: [
                { value: 'albumcomment', label: 'アルバムコメント (albumcomment)', type: 'string' },
                { value: 'albumtype', label: 'アルバムタイプ (albumtype)', type: 'string' },
                { value: 'catalognumber', label: 'カタログ番号 (catalognumber)', type: 'string' },
                { value: 'compilation', label: 'コンピレーション (compilation)', type: 'boolean' },
                { value: 'recordlabel', label: 'レコード会社 (recordlabel)', type: 'string' },
                { value: 'releasecountry', label: 'リリース国 (releasecountry)', type: 'string' }
            ]
        },
        {
            group: 'ファイル・品質 (File & Quality)',
            fields: [
                { value: 'filepath', label: 'ファイルパス (filepath)', type: 'string' },
                { value: 'filetype', label: 'ファイル形式 (filetype: mp3, flac等)', type: 'string' },
                { value: 'bitrate', label: 'ビットレート (bitrate)', type: 'number' },
                { value: 'bitdepth', label: 'ビット深度 (bitdepth)', type: 'number' },
                { value: 'size', label: 'ファイルサイズ (size)', type: 'number' },
                { value: 'channels', label: 'チャンネル数 (channels)', type: 'number' },
                { value: 'hascoverart', label: 'アートワーク有無 (hascoverart)', type: 'boolean' },
                { value: 'explicitstatus', label: 'Explicitステータス (explicitstatus)', type: 'string' }
            ]
        },
        {
            group: '再生・お気に入り (Listening & Favorites)',
            fields: [
                { value: 'playcount', label: '再生回数 (playcount)', type: 'number' },
                { value: 'rating', label: '評価 0-5 (rating)', type: 'number' },
                { value: 'loved', label: 'お気に入り (loved)', type: 'boolean' },
                { value: 'lastplayed', label: '最終再生日時 (lastplayed)', type: 'date' },
                { value: 'dateloved', label: 'お気に入り登録日時 (dateloved)', type: 'date' }
            ]
        },
        {
            group: '日付 (Dates)',
            fields: [
                { value: 'dateadded', label: 'ライブラリ追加日時 (dateadded)', type: 'date' },
                { value: 'datemodified', label: 'ファイル更新日時 (datemodified)', type: 'date' },
                { value: 'originaldate', label: 'オリジナルリリース日 (originaldate)', type: 'date' },
                { value: 'releasedate', label: 'リリース日 (releasedate)', type: 'date' }
            ]
        },
        {
            group: 'テキスト・数値タグ (Tags)',
            fields: [
                { value: 'comment', label: 'コメント (comment)', type: 'string' },
                { value: 'lyrics', label: '歌詞 (lyrics)', type: 'string' },
                { value: 'grouping', label: 'グルーピング (grouping)', type: 'string' },
                { value: 'mood', label: 'ムード (mood)', type: 'string' },
                { value: 'key', label: '音楽キー (key)', type: 'string' },
                { value: 'disctotal', label: '総ディスク数 (disctotal)', type: 'number' },
                { value: 'tracktotal', label: '総トラック数 (tracktotal)', type: 'number' }
            ]
        },
        {
            group: 'プレイリスト (Playlist)',
            fields: [
                { value: 'id', label: 'プレイリスト判定 (id)', type: 'playlist' }
            ]
        }
    ];

    // 全フィールドの平坦化検索用ヘルパー
    const allFields = fieldCategories.flatMap(cat => cat.fields);

    // 人名系カテゴリとして網羅機能を適用したいフィールドの一覧
    const personFields = ['artist', 'albumartist', 'artists', 'albumartists', 'composer', 'lyricist', 'arranger', 'conductor', 'producer', 'remixer', 'performer'];

    // 演算子の定義
    const operators = {
        string: [
            { value: 'contains', label: '〜を含む (contains)' },
            { value: 'notContains', label: '〜を含まない (notContains)' },
            { value: 'is', label: '〜と等しい (is)' },
            { value: 'isNot', label: '〜と等しくない (isNot)' },
            { value: 'startsWith', label: '〜で始まる (startsWith)' },
            { value: 'endsWith', label: '〜で終わる (endsWith)' }
        ],
        number: [
            { value: 'is', label: '〜と等しい (is)' },
            { value: 'isNot', label: '〜と等しくない (isNot)' },
            { value: 'gt', label: '〜より大きい (>)' },
            { value: 'lt', label: '〜より小さい (<)' }
        ],
        boolean: [
            { value: 'is', label: '〜である (is)' }
        ],
        date: [
            { value: 'inTheLast', label: '過去◯日以内 (inTheLast)' },
            { value: 'notInTheLast', label: '過去◯日以外 (notInTheLast)' },
            { value: 'before', label: '指定日より前 (before)' },
            { value: 'after', label: '指定日より後 (after)' }
        ],
        playlist: [
            { value: 'inPlaylist', label: '指定プレイリストに含まれる (inPlaylist)' },
            { value: 'notInPlaylist', label: '指定プレイリストに含まれない (notInPlaylist)' }
        ]
    };

    function addRuleRow(fieldValue = 'artist', opValue = 'contains', valValue = '') {
        const container = document.getElementById('rulesContainer');
        const row = document.createElement('div');
        row.className = 'rule-row';

        // フィールド選択
        const fieldSelect = document.createElement('select');
        fieldSelect.className = 'field';
        fieldCategories.forEach(cat => {
            const group = document.createElement('optgroup');
            group.label = cat.group;
            cat.fields.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.value;
                opt.textContent = f.label;
                if (f.value === fieldValue) opt.selected = true;
                group.appendChild(opt);
            });
            fieldSelect.appendChild(group);
        });

        const opSelect = document.createElement('select');
        opSelect.className = 'operator';

        function updateOperators() {
            const selectedField = allFields.find(f => f.value === fieldSelect.value) || allFields[0];
            const ops = operators[selectedField.type] || operators.string;
            opSelect.innerHTML = '';
            ops.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.value;
                opt.textContent = o.label;
                if (o.value === opValue) opt.selected = true;
                opSelect.appendChild(opt);
            });
        }

        fieldSelect.onchange = () => {
            updateOperators();
            toggleHelper(fieldSelect);
            updateJsonPreview();
        };
        opSelect.onchange = updateJsonPreview;

        updateOperators();

        row.innerHTML = `
            <div class="row">
                <div style="flex:2.5;"></div>
                <div style="flex:2;"></div>
                <button class="danger" onclick="this.closest('.rule-row').remove(); updateJsonPreview();">✕</button>
            </div>
            <div class="artist-helper" style="display:block;">
                <div class="hint">漢字 (そのまま出力)</div>
                <div class="row">
                    <input class="jpS" placeholder="姓（漢字）" style="flex:1;" oninput="updateJsonPreview()">
                    <input class="jpG" placeholder="名（漢字）" style="flex:1;" oninput="updateJsonPreview()">
                </div>
                <div class="hint">ひらがな (カナ・ローマ字を自動生成)</div>
                <div class="row">
                    <input class="kanaS" placeholder="せい" style="flex:1;" oninput="updateJsonPreview()">
                    <input class="kanaG" placeholder="めい" style="flex:1;" oninput="updateJsonPreview()">
                </div>
                <div class="hint">直接入力 / 海外アーティスト (1行1項目)</div>
                <textarea class="rawList" placeholder="例: The Beatles&#10;例: 宇多田ヒカル" style="height:50px; margin-top:5px; width:100%;" oninput="updateJsonPreview()"></textarea>
            </div>
            <div class="normal-input" style="display:none; margin-top:8px;">
                <input type="text" class="ruleValue" value="${valValue}" placeholder="値を入力" style="width:100%;" oninput="updateJsonPreview()">
            </div>
        `;

        row.querySelector('.row div:nth-child(1)').appendChild(fieldSelect);
        row.querySelector('.row div:nth-child(2)').appendChild(opSelect);

        container.appendChild(row);
        toggleHelper(fieldSelect);
        updateJsonPreview();
    }

    // 変更前: 変更前のコードはコメントも含め省略せずに表示する。
    function toggleHelper(select) {
        const row = select.closest('.rule-row');
        const artistHelper = row.querySelector('.artist-helper');
        const normalInput = row.querySelector('.normal-input');

        if (personFields.includes(select.value)) {
            artistHelper.style.display = 'block';
            normalInput.style.display = 'none';
        } else {
            artistHelper.style.display = 'none';
            normalInput.style.display = 'block';
        }
    }

    function getFullVariations(text, allowReverse = false) {
        if (!text) return [];
        let results = new Set();
        const jpHalf = text.trim();
        [jpHalf].forEach(t => {
            results.add(t);
            const katakana = t.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
            results.add(katakana);
        });
        const romanMap = {'あ':['a'],'い':['i'],'う':['u'],'え':['e'],'お':['o'],'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],'さ':['sa'],'し':['shi','si'],'す':['su'],'せ':['se'],'そ':['so'],'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],'や':['ya'],'ゆ':['yu'],'よ':['yo'],'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],'わ':['wa'],'を':['wo','o'],'ん':['n','nn'],'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],'だ':['da'],'ぢ':['ji','di'],'づ':['zu','du'],'で':['de'],'ど':['do'],'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],'じゃ':['ja','zya'],'じゅ':['ju','zyu'],'じょ':['jo','zyo'],'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],'っ':['t','s','k','p']};
        function toRoman(str) {
            let s = str;
            let patterns = [''];
            let i = 0;
            while (i < s.length) {
                let found = false;
                if (i + 1 < s.length) {
                    let doubleChar = s.substring(i, i + 2);
                    if (romanMap[doubleChar]) {
                        let nextPatterns = [];
                        patterns.forEach(p => { romanMap[doubleChar].forEach(r => nextPatterns.push(p + r)); });
                        patterns = nextPatterns;
                        i += 2; found = true;
                    }
                }
                if (!found) {
                    let singleChar = s.substring(i, i + 1);
                    if (romanMap[singleChar]) {
                        let nextPatterns = [];
                        patterns.forEach(p => {
                            if (singleChar === 'っ' && i + 1 < s.length) {
                                let nextChar = s.substring(i+1, i+2);
                                let nextRom = romanMap[nextChar] ? romanMap[nextChar][0][0] : '';
                                nextPatterns.push(p + nextRom);
                            } else {
                                romanMap[singleChar].forEach(r => nextPatterns.push(p + r));
                            }
                        });
                        patterns = nextPatterns;
                    } else {
                        patterns = patterns.map(p => p + singleChar);
                    }
                    i++;
                }
            }
            return patterns;
        }
        toRoman(jpHalf).forEach(r => results.add(r));
        if(allowReverse && jpHalf.includes(' ')) {
            const parts = jpHalf.split(' ');
            if(parts.length === 2) {
                const reversed = parts[1] + ' ' + parts[0];
                toRoman(reversed).forEach(r => results.add(r));
            }
        }
        return Array.from(results);
    }

    function buildNspObject() {
        const title = document.getElementById('playlistTitle').value || 'スマートプレイリスト';
        const match = document.getElementById('matchLogic').value;
        const limitStr = document.getElementById('maxTracks').value;
        const sortField = document.getElementById('sortField').value;
        const sortOrder = document.getElementById('sortOrder').value;

        const rows = document.querySelectorAll('.rule-row');
        const queries = [];

        rows.forEach(row => {
            const field = row.querySelector('.field').value;
            const op = row.querySelector('.operator').value;

            if (personFields.includes(field)) {
                const v = new Set();
                const kanjiS = row.querySelector('.jpS')?.value.trim() || '';
                const kanjiG = row.querySelector('.jpG')?.value.trim() || '';
                if(kanjiS || kanjiG) {
                    v.add((kanjiS + kanjiG).trim());
                    v.add((kanjiS + ' ' + kanjiG).trim());
                }
                const kanaS = row.querySelector('.kanaS')?.value.trim() || '';
                const kanaG = row.querySelector('.kanaG')?.value.trim() || '';
                if(kanaS || kanaG) {
                    const basePattern = (kanaS + ' ' + kanaG).trim();
                    getFullVariations(basePattern, true).forEach(variation => v.add(variation)); 
                }
                const rawList = row.querySelector('.rawList')?.value || '';
                rawList.split('\n').forEach(val => { 
                    const line = val.trim();
                    if(line) {
                        if(/[ぁ-ん]/.test(line)) { getFullVariations(line, false).forEach(variation => v.add(variation)); }
                        else { v.add(line); }
                    }
                });

                v.forEach(val => {
                    queries.push({ field: field, operator: op, value: val });
                });
            } else {
                const valInput = row.querySelector('.ruleValue');
                if (valInput) {
                    let val = valInput.value;
                    if (val === 'true') val = true;
                    else if (val === 'false') val = false;
                    else if (!isNaN(val) && val.trim() !== '') val = Number(val);

                    queries.push({
                        field: field,
                        operator: op,
                        value: val
                    });
                }
            }
        });

        const nsp = {
            title: title,
            all: match === 'all',
            queries: queries,
            sort: sortField
        };

        if (sortField !== 'random') {
            nsp.order = sortOrder;
        }

        if (limitStr && !isNaN(limitStr) && limitStr.trim() !== '') {
            nsp.limit = Number(limitStr);
        }

        return nsp;
    }

    function updateJsonPreview() {
        const nspObj = buildNspObject();
        document.getElementById('jsonPreview').textContent = JSON.stringify(nspObj, null, 2);
    }

    function downloadNspFile() {
        const nspObj = buildNspObject();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(nspObj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);

        let filename = (nspObj.title || 'playlist').replace(/[\/\\?%*:|"<>]/g, '_') + '.nsp';
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    window.onload = () => {
        addRuleRow('artist', 'contains', '');
        document.getElementById('playlistTitle').oninput = updateJsonPreview;
        document.getElementById('matchLogic').onchange = updateJsonPreview;
        document.getElementById('maxTracks').oninput = updateJsonPreview;
    };
</script>

</body>
</html>
